name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  ci:
    # Wieder ubuntu-latest: Die Festlegung auf 24.04 war nur noetig, weil
    # setup-ruby fuer ubuntu-26.04 kein Ruby 3.2.4 mehr liefert (#884).
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saisonmanager
          POSTGRES_PASSWORD: saisonmanager
          POSTGRES_DB: saisonmanager-api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      CI: true
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: saisonmanager
      DB_PASSWORD: saisonmanager

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Geheimnis-Suche über die GANZE Historie (deshalb fetch-depth: 0), in
      # Sekunden erledigt. Regeln und Ausnahmen: .gitleaks.toml und
      # .gitleaksignore. Das Binary wird mit fester Version und Prüfsumme
      # geladen; die offizielle gitleaks-action verlangt bei Organisations-
      # Repos einen Lizenzschlüssel.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .

      # libvips wird von ruby-vips beim Boot via FFI geladen (ActiveStorage variant_processor :vips).
      # Paketname auf Ubuntu 24.04 ist libvips42t64; Fallback für ältere Runner-Images.
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips42t64 || sudo apt-get install -y libvips42

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
          bundler-cache: true

      - name: Create and migrate database
        run: bundle exec rails db:create db:migrate

      - name: Test
        run: bundle exec rails test

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: RuboCop
        run: bundle exec rubocop --no-color
        # --no-color for cleaner CI output
