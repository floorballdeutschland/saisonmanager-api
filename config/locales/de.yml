# Deutsche Datums- und Zeitformate. Bewusst nur diese: Die Anwendung nutzt
# I18n ausschließlich zum Formatieren von Datum und Uhrzeit (es gibt keine
# übersetzten Texte, en.yml enthält nur den Rails-Beispieleintrag). Alles
# andere – insbesondere die Fehlermeldungen aus ActiveRecord/ActiveModel –
# kommt weiterhin über den Fallback aus :en und bleibt damit unverändert.
#
# Deshalb auch kein rails-i18n-Gem: dafür wäre die ganze Abhängigkeit nur für
# die Monatsnamen unten dabei.
de:
  date:
    formats:
      default: "%d.%m.%Y"
      short: "%d.%m."
      long: "%e. %B %Y"
    day_names:
      - Sonntag
      - Montag
      - Dienstag
      - Mittwoch
      - Donnerstag
      - Freitag
      - Samstag
    abbr_day_names:
      - So
      - Mo
      - Di
      - Mi
      - Do
      - Fr
      - Sa
    month_names:
      -
      - Januar
      - Februar
      - März
      - April
      - Mai
      - Juni
      - Juli
      - August
      - September
      - Oktober
      - November
      - Dezember
    abbr_month_names:
      -
      - Jan
      - Feb
      - Mär
      - Apr
      - Mai
      - Jun
      - Jul
      - Aug
      - Sep
      - Okt
      - Nov
      - Dez
    order:
      - :day
      - :month
      - :year
  time:
    formats:
      default: "%d.%m.%Y %H:%M"
      short: "%d.%m. %H:%M"
      long: "%e. %B %Y %H:%M"
    am: vormittags
    pm: nachmittags
